name: 年次ルール更新チェック

# 毎年6月1日(講習会シーズン前)と、手動実行時にチェックする。
# JVA公式サイトの内容ハッシュが変化していたら Issue を自動作成し、
# questions.json の見直しを促す。questions.json 自体は自動更新しない
# (規則の解釈が必要なため、必ず人が確認すること)。
on:
  schedule:
    - cron: "0 0 1 6 *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: ハッシュチェックを実行
        id: check
        run: |
          set -e
          OUTPUT=$(python3 scripts/check_rule_updates.py)
          echo "result=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT"

      - name: 変更をコミット
        run: |
          git config user.name "rule-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source_hashes.json
          git diff --cached --quiet || git commit -m "chore: 年次ルール更新チェック($(date +%Y-%m-%d))"
          git push || true

      - name: 変更があれば Issue を作成
        if: startsWith(steps.check.outputs.result, 'CHANGED')
        uses: actions/github-script@v7
        with:
          script: |
            const result = `${{ steps.check.outputs.result }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `【要確認】審判規則の情報源に更新の可能性 (${new Date().toISOString().slice(0,10)})`,
              body: [
                "年次ルール更新チェックにより、監視対象ページの内容に変化が検出されました。",
                "",
                "変化が検出された項目: `" + result.replace("CHANGED:", "") + "`",
                "",
                "対応手順:",
                "1. (公財)日本バレーボール協会「6人制バレーボール競技規則」の最新版を確認する",
                "2. 神奈川県バレーボール協会・相模原バレーボール協会のC級審判講習会案内も確認する",
                "3. 変更点があれば `questions.json` の該当する問題・解説・`meta.version` / `meta.lastUpdated` を更新する",
                "4. 確認のみでルール変更がなければ、このIssueをクローズしてよい",
              ].join("\n"),
              labels: ["rule-update"],
            });
